# Install to /etc/fail2ban/filter.d/storm-hub-auth.conf
#
# Matches a failed storm-hub login (POST /auth/login, HTTP 401) in Caddy's JSON access log
# (infra/Caddyfile's `log` block). Uses lookaheads instead of a strict field order so it doesn't
# break if Caddy ever reorders its JSON encoder's output.
[Definition]
failregex = ^(?=.*"status":\s*401)(?=.*"method":\s*"POST")(?=.*"uri":\s*"/auth/login")(?=.*"remote_ip":\s*"<HOST>").*$
ignoreregex =
