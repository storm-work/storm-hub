# Drop-in: give the Hub (and thus every worker it launches) a shared X display.
# With DISPLAY set at process start, _ensure_headful_display() reuses it (socket exists),
# starts NO per-worker Xvfb, and 61e5339's env=dict(os.environ) carries DISPLAY into Chromium.
[Unit]
After=xvfb99.service
Wants=xvfb99.service

[Service]
Environment=DISPLAY=:99
